version: "3.1"

rules:

- rule: Saluta sempre
  steps:
  - intent: saluto
  - action: utter_saluto

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: chiedi di riformulare quando non capisci
  steps:
  - intent: nlu_fallback
  - action: utter_riformula

- rule: info biblioteca
  steps:
  - intent: info_biblioteca
  - action: utter_info_biblioteca

- rule: info ok
  steps:
  - intent: info_ok
  - action: utter_info_ok

- rule: orario apertura
  steps:
  - intent: orario
  - action: utter_orario

- rule: attivazione fomr
  steps:
  - intent: rent_book
  - action: rent_book_form
  - active_loop: rent_book_form

- rule: Restituisce informazioni sui libri
  steps:
  - intent: info_libro
  - action: action_find_info_libro
#  - action: action_info_libro

- rule: Restituisce il prezzo del libro 
  steps: 
  - intent: info_prezzo
  - action: action_info_prezzo

- rule: Restituisce l'età consigliata del libro 
  steps: 
  - intent: info_età_consigliata
  - action: action_info_età_consigliata

- rule: Restituisce il reparto del libro 
  steps: 
  - intent: info_reparto
  - action: action_info_reparto
